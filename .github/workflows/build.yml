name: Build AirPods Spatial Lab APK (phone-only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'AirPodsSpatialLab_v0.2_AirPods5_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout uploaded project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          test -f AirPodsSpatialLab_v0.2_AirPods5_Android_Project.zip
          mkdir -p extracted
          unzip -q AirPodsSpatialLab_v0.2_AirPods5_Android_Project.zip -d extracted
          test -f extracted/AirPodsSpatialLab_v0.2/app/build.gradle

      - name: Build unsigned-test / debug-signed APK
        working-directory: extracted/AirPodsSpatialLab_v0.2
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare clearly labeled test APK
        run: |
          mkdir -p output
          cp extracted/AirPodsSpatialLab_v0.2/app/build/outputs/apk/debug/app-debug.apk \
            output/AirPodsSpatialLab-v0.2-EXPERIMENTAL-debug.apk
          sha256sum output/*.apk

      - name: Upload APK to workflow results
        uses: actions/upload-artifact@v4
        with:
          name: AirPodsSpatialLab-experimental-APK
          path: output/*.apk
          if-no-files-found: error

      - name: Publish direct APK download to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 'v0.2-experimental' >/dev/null 2>&1; then
            gh release upload 'v0.2-experimental' output/*.apk --clobber
          else
            gh release create 'v0.2-experimental' output/*.apk \
              --title 'AirPods Spatial Lab v0.2 - experimental, unverified' \
              --notes 'WARNING: No real AirPods 5 dynamic head tracking has been validated. This is a test build; audio capture replay can echo. No Root required for the app, but AACP sensor access may fail on Android 17.'
          fi
