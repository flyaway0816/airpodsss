name: Build AirPods Spatial Lab APK (phone-only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'AirPodsSpatialLab_v0.2_AirPods5_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout uploaded project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub Ubuntu runners have Android SDK installed already.
      # Skip android-actions/setup-android@v3, which failed in the first run.
      - name: Use preinstalled Android SDK and install API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$TOOL" ]]; then
            echo "::error::Missing preinstalled sdkmanager: $TOOL"
            exit 1
          fi
          "$TOOL" --version
          "$TOOL" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f AirPodsSpatialLab_v0.2_AirPods5_Android_Project.zip
          mkdir -p extracted
          unzip -q AirPodsSpatialLab_v0.2_AirPods5_Android_Project.zip -d extracted
          test -f extracted/AirPodsSpatialLab_v0.2/app/build.gradle

      - name: Build experimental debug APK
        working-directory: extracted/AirPodsSpatialLab_v0.2
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp extracted/AirPodsSpatialLab_v0.2/app/build/outputs/apk/debug/app-debug.apk output/AirPodsSpatialLab-v0.2-EXPERIMENTAL-debug.apk
          sha256sum output/*.apk

      - name: Upload APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirPodsSpatialLab-experimental-APK
          path: output/*.apk
          if-no-files-found: error

      - name: Publish test APK to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view 'v0.2-experimental' > /dev/null 2>&1; then
            gh release upload 'v0.2-experimental' output/*.apk --clobber
          else
            gh release create 'v0.2-experimental' output/*.apk \
              --title 'AirPods Spatial Lab v0.2 - experimental' \
              --notes 'UNVERIFIED TEST APK. AirPods 5 real head tracking has not been demonstrated. Audio replay can echo; use low volume.'
          fi
