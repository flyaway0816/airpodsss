name: Build AirPods Spatial Lab v0.3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AirPodsSpatialLab-v0.3.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$TOOL" ]]; then
            echo "::error::Missing sdkmanager at $TOOL"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$TOOL" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract v0.3 source
        shell: bash
        run: |
          set -euo pipefail
          test -f 'AirPodsSpatialLab-v0.3.zip'
          mkdir -p extracted
          unzip -q 'AirPodsSpatialLab-v0.3.zip' -d extracted
          test -f extracted/AirPodsSpatialLab-v0.3/app/build.gradle

      - name: Build experimental APK
        working-directory: extracted/AirPodsSpatialLab-v0.3
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare v0.3 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp extracted/AirPodsSpatialLab-v0.3/app/build/outputs/apk/debug/app-debug.apk \
            output/AirPodsSpatialLab-v0.3-EXPERIMENTAL-debug.apk
          sha256sum output/*.apk

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPodsSpatialLab-v0.3-APK
          path: output/AirPodsSpatialLab-v0.3-EXPERIMENTAL-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v0.3-experimental' >/dev/null 2>&1; then
            gh release upload 'v0.3-experimental' output/*.apk --clobber
          else
            gh release create 'v0.3-experimental' output/*.apk \
              --title 'AirPods Spatial Lab v0.3 (experimental)' \
              --notes 'Unverified root-free Bluetooth L2CAP head tracking experiment for AirPods 5. APK build success does not establish live head tracking. Lower volume before testing playback capture.'
          fi
